<!-- Form -->
<form class="space-y-5">
<!-- Username/Phone -->
<div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-arco-text-tertiary">person</span>
<input class="w-full pl-10 pr-3 py-2 border border-arco-border rounded-arco text-arco-text-primary font-body-md text-body-md placeholder:text-arco-text-tertiary input-focus transition-all bg-white" placeholder="账号/手机号" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-arco-text-tertiary">lock</span>
<input class="w-full pl-10 pr-10 py-2 border border-arco-border rounded-arco text-arco-text-primary font-body-md text-body-md placeholder:text-arco-text-tertiary input-focus transition-all bg-white" id="password-input" placeholder="密码" required="" type="password"/>
<button class="absolute right-3 text-arco-text-tertiary hover:text-arco-text-secondary focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[18px]" id="eye-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded-arco border-arco-border text-arco-blue focus:ring-arco-blue/20 cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-body-sm text-arco-text-secondary group-hover:text-arco-text-primary transition-colors">记住我</span>
</label>
<a class="font-body-sm text-body-sm text-arco-blue hover:text-arco-blue-hover transition-colors" href="#">忘记密码？</a>

                        登录
                    </button>
<button class="w-full bg-white hover:bg-surface-container-low text-arco-text-primary border border-arco-border font-body-md text-body-md font-medium py-2.5 rounded-arco transition-colors shadow-sm" type="button">
                        短信验证码登录
                    </button>

<div class="mt-8 text-center">
<span class="font-body-sm text-body-sm text-arco-text-tertiary">还没有账号？</span>

</div>
</div>
</div>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password-input');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                eyeIcon.textContent = 'visibility_off';
            }
        }
    </script>
